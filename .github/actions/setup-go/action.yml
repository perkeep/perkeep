name: Set up Go
description: >
  Installs the Go version from go.mod and restores the Go module and build
  caches saved by save-go-cache from a push to master. Pull requests can read
  master's caches but not each other's, so only master saves them (see
  save-go-cache). If no cache matches go.sum exactly, the newest one for the
  same Go version is restored instead, so most of the build cache survives
  dependency changes.

inputs:
  cache-key-suffix:
    description: >
      Appended to the workflow name in the cache key, to give each job of a
      matrix its own cache. It must match the save-go-cache input.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Don't generate DWARF, which nothing in CI uses: it makes linking
    # (of each test binary, and of the binaries tests run) take about
    # twice as long. make.go's --ldflags, when given, override this.
    - shell: bash
      run: echo "GOFLAGS=-ldflags=-w" >> "$GITHUB_ENV"

    # On Windows, the Go caches default to the user's profile on C:, which
    # is much slower than D:, where the checkout is. Extracting the caches
    # there took most of the job's time.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "GOMODCACHE=D:\\gocache\\mod" >> "$GITHUB_ENV"
        echo "GOCACHE=D:\\gocache\\build" >> "$GITHUB_ENV"

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false

    - id: go-env
      shell: bash
      run: |
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "prefix=go-${{ github.workflow }}${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ runner.arch }}-$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.go-env.outputs.modcache }}
          ${{ steps.go-env.outputs.buildcache }}
        key: ${{ steps.go-env.outputs.prefix }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.go-env.outputs.prefix }}-${{ hashFiles('go.sum') }}-
          ${{ steps.go-env.outputs.prefix }}-
