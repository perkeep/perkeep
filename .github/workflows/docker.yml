name: Docker

on:
  push:
    # push events will publish a new image for a new version or for the latest commit.
    tags: ["v*"]
    branches: ["master"]
  pull_request:
    # Run the workflow on pull_request events to ensure we can still build the image.
    # We only publish the image on push events (see if statements in steps below).
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ${{ startsWith(github.ref, 'refs/tags/') && 'linux-16cpu' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Emulation so arm64/arm/v7 layers can be built
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # exact git tag (e.g., v1.2.3)
            type=ref,event=tag
            # for work on the main/master branch (we plan to move to "main" one
            # day), push to docker tag "dev". We reserve the label "latest" to
            # mean the latest stable release in the future.
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            # and to "sha-" and the short commit hash, which unlike "dev"
            # always names the same image, to deploy a particular commit's.
            type=sha,enable=${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: |
            ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
            type=gha
          # Only write the cache on push events: GitHub Actions caches
          # written by a PR are only readable by that same PR, but all
          # PRs can read master's. mode=min (only the final image's
          # layers) is enough, since the build stage's layers change
          # with every commit anyway.
          cache-to: |
            ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:buildcache,mode=min', env.REGISTRY, env.IMAGE_NAME) || '' }}
            ${{ github.event_name == 'push' && 'type=gha,mode=min' || '' }}
          provenance: true
          sbom: true

      # Sign the Docker image
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        if: github.event_name == 'push'
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

      # Also publish the Dockerfile's base stage, the image without
      # Perkeep's binaries, for building images of binaries built
      # elsewhere (as by mkctr) that run as the official image does: as
      # "base", "base-sha-" and the short commit hash, and "base-" and the
      # git tag. Its layers are the image's, cached by the build above.
      - name: Extract Docker metadata of the base image
        id: meta-base
        if: github.event_name == 'push'
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,prefix=base-
            type=raw,value=base,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=base-sha-,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build and push the base image
        id: build-and-push-base
        if: github.event_name == 'push'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: base
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          provenance: true
          sbom: true

      - name: Sign the published base image
        if: github.event_name == 'push'
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push-base.outputs.digest }}
